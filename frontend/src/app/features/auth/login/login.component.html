<div class="login-page">

  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>

  <div class="login-card">

    <div class="logo">

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M7 7h10M7 12h6M7 17h10"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
        />

        <circle
          cx="17"
          cy="12"
          r="2"
          fill="currentColor"
        />
      </svg>

    </div>

    <h1>
      Welcome back
    </h1>

    <p class="subtitle">
      Sign in to access your projects, tasks, and team workspace.
    </p>

    <div class="field">

      <label>Email</label>

      <input
        type="email"
        placeholder="you@example.com"
        [(ngModel)]="email"
      >

    </div>

    <div class="field">

      <label>Password</label>

      <input
        type="password"
        placeholder="••••••••"
        [(ngModel)]="password"
      >

    </div>

    @if(error){

      <p class="error">
        {{ error }}
      </p>

    }

    <button
      type="button"
      (click)="login()"
    >

      Sign In

      <svg
        class="arrow"
        viewBox="0 0 24 24"
      >
        <path
          d="M5 12h13M13 6l6 6-6 6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </button>

    <div class="footer">

      <span>
        TeamFlow © 2026
      </span>

    </div>

  </div>

</div>
