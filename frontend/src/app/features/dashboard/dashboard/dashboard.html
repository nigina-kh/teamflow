<div class="dashboard">

  <div class="background-glow glow-1"></div>
  <div class="background-glow glow-2"></div>
  <div class="background-glow glow-3"></div>

  <section class="hero">

    <div>

      <h1>
        Welcome back!
      </h1>

      <p>
        Here's everything happening across your projects today.
      </p>

    </div>

  </section>

  <section class="stats">

    @for (stat of stats(); track stat.label) {

      <app-stat-card
        [label]="stat.label"
        [value]="stat.value"
        [change]="stat.change"
        [color]="stat.color">
      </app-stat-card>

    }

  </section>

  <section class="content-grid">

    <div class="main-column">

      <app-recent-projects></app-recent-projects>

      <app-activity-feed></app-activity-feed>

    </div>

    <aside class="side-column">

      <app-recent-tasks></app-recent-tasks>

    </aside>

  </section>

</div>
