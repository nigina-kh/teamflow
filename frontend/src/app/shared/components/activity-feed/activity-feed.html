<div class="panel">

  <h2>Activity</h2>

  @for(activity of activities; track activity.action){

    <div class="activity">

      <div class="avatar">
        {{ activity.user[0] }}
      </div>

      <div>

        <div class="user">
          {{ activity.user }}
        </div>

        <div class="action">
          {{ activity.action }}
        </div>

      </div>

    </div>

  }

</div>
