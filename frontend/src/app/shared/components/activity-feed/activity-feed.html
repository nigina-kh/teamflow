<div class="panel">

  <h2>
    Activity Feed
  </h2>

  @for(activity of activities; track activity.text){

    <div class="activity">

      <div class="dot"></div>

      <div>

        <div class="text">
          {{ activity.text }}
        </div>

        <div class="time">
          {{ activity.time }}
        </div>

      </div>

    </div>

  }

</div>
