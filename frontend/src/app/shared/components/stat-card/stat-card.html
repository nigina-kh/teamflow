<div class="card">

  <div
    class="glow"
    [style.background]="color">
  </div>

  <div class="top">

    <div
      class="indicator"
      [style.background]="color">
    </div>

    <div class="change">
      {{ change }}
    </div>

  </div>

  <div class="label">
    {{ label }}
  </div>

  <div class="value">
    {{ value }}
  </div>

</div>
