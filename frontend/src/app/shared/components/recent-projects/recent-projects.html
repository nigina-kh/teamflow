<div class="panel">

  <h2>
    Recent Projects
  </h2>

  @for (project of projects; track project.name) {

    <div class="project">

      <div>

        <div class="name">
          {{ project.name }}
        </div>

      </div>

      <div class="status">
        {{ project.status }}
      </div>

    </div>

  }

</div>
